services:
  postgres:
    image: postgres:16-alpine
    container_name: aeme_postgres
    environment:
      POSTGRES_DB: aeme_db
      POSTGRES_USER: user_db
      POSTGRES_PASSWORD: password_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_db -d aeme_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: aeme_keycloak
    command: start-dev
    environment:
      KC_HOSTNAME_URL: https://unrefrained-primal-harlee.ngrok-free.dev
      KC_HOSTNAME_ADMIN_URL: https://unrefrained-primal-harlee.ngrok-free.dev
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/aeme_db
      KC_DB_USERNAME: user_db
      KC_DB_PASSWORD: password_db
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: