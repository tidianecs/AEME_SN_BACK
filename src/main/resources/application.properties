# Server
spring.application.name=${APP_NAME:backend}
server.port=${SERVER_PORT:8081}

# Datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# OAuth2 Resource Server (Keycloak)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI}

# Keycloak Admin
keycloak.server-url=${KEYCLOAK_URL}
keycloak.admin.realm=${KEYCLOAK_REALM}
keycloak.admin.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.admin.client-secret=${KEYCLOAK_CLIENT_SECRET}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Files
app.upload.dir=${UPLOAD_DIR:uploads}