services:
  postgres:
    image: postgres:16-alpine
    container_name: aeme_postgres
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_db -d aeme_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: aeme_keycloak
    command: start-dev
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./keycloak-theme/aeme:/opt/keycloak/themes/aeme

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aeme_backend
    ports:
      - "8081:8081"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:

